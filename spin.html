<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çarx — Misterio</title>
<script src="theme.js"></script>
<script src="analytics.js"></script>
<script src="i18n.js?v=2"></script>
<script src="nav.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎁</text></svg>">
</head>
<body>
<header class="hdr">
  <a class="logo" href="index.html">
    <svg class="logo-svg" viewBox="0 0 240 240" width="38" height="38" aria-hidden="true">
      <circle cx="120" cy="120" r="118" fill="#ffffff"/>
      <circle cx="120" cy="120" r="118" fill="none" stroke="#e9d5ff" stroke-width="2"/>
      <g fill="none" stroke="#2e1065">
        <circle cx="120" cy="120" r="110" stroke-width="2.4"/>
        <circle cx="120" cy="120" r="102" stroke-width="1.1"/>
        <g stroke-width="1.1" opacity="0.5"><polygon points="120,54 154,131 86,131"/><polygon points="120,186 86,109 154,109"/></g>
      </g>
      <text x="120" y="130" fill="#2e1065" font-family="Georgia,serif" font-weight="700" font-size="30" text-anchor="middle">Misterio</text>
    </svg>
    <span class="logo-txt">Misterio</span>
  </a>
  <nav class="nav"><a href="pricing.html">Qiymət</a><a href="add-company.html">Şirkət əlavə et</a></nav>
  <button class="theme-btn" onclick="toggleTheme()" aria-label="Tema">☀️</button>
  <a class="avatar" href="profile.html" title="Profil">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
  </a>
</header>

<main>
  <section class="wrap">
    <div class="welcome" id="welcome"></div>
    <!-- ödənişsiz bildiriş (toast) -->
    <div class="toast-notice hidden" id="freeNotice">
      <div class="tn-ic">⏳</div>
      <div class="tn-body">
        <b id="tnTitle"></b>
        <div id="tnText"></div>
      </div>
    </div>

    <!-- abunəlik yoxdursa / limit bitibsə -->
    <div class="block-box hidden" id="blockBox">
      <div class="bb-ic" id="bbIc">🔒</div>
      <h2 id="bbTitle"></h2>
      <p id="bbText"></p>
      <a class="btn big" id="bbBtn" href="pricing.html">Abunə ol — 9.90 AZN/ay</a>
      <a class="btn ghost" id="bbProfileBtn" href="profile.html" style="display:none">Profilim</a>
    </div>

    <div id="spinArea">
      <h2 class="sec-title" data-i18n="spin.cat">1. Kateqoriya seç</h2>
      <div id="cats" class="cats"></div>
    </div>
  </section>

  <section class="wrap wheel-sec" id="wheelSec">
    <h2 class="sec-title" id="wheelTitle" data-i18n="spin.title">2. Çarxı fırlat</h2>
    <div class="wheel-box">
      <div class="pointer"></div>
      <div class="wheel-outer"><canvas id="wheel" width="520" height="520"></canvas></div>
      <button id="spinBtn" class="btn big" data-i18n="spin.btn">🔮 Çarxı fırlat</button>
      <p class="hint" id="hint"></p>
    </div>
  </section>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-card">
    <div class="confetti">🎉</div>
    <h3>Təbriklər!</h3>
    <p class="win" id="winTxt"></p>
    <p class="sub" id="winCat"></p>
    <p class="sub">Kupon "Kuponlarım" bölməsinə əlavə olundu.</p>
    <div class="row">
      <a class="btn ghost" href="profile.html">Kuponlarım</a>
      <button class="btn" id="closeModal">Bağla</button>
    </div>
  </div>
</div>

<footer class="ftr">
  <div class="ftr-logo">Misterio</div>
  <div>info@misterio.az · +994 70 562 12 69</div>
  <div class="small">Bütün hüquqlar qorunur © 2026 Misterio</div>
</footer>
<script src="db.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="spin.js"></script>
<footer style="text-align:center;padding:24px;color:#9f7aea;font-size:13px">
</footer>
</body>
</html>
